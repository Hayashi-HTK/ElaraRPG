<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>RPG AAA Card</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #0f0d0a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: serif;
}

/* CONTAINER */
.card-wrapper {
    position: relative;
    width: 420px;
    height: 410px;
}

/* SVG BORDA */
.card-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* CONTEÚDO */
.card-content {
  position: absolute;
  inset: 20px;
  background: rgba(20,18,14,0.92);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #d4af37;
  text-align: center;
  padding: 20px;
}

.card-content h1 {
  margin-bottom: 10px;
}

.card-content p {
  opacity: 0.7;
}


.ornamental-line {
    opacity: 0.4;
    position: relative;
    top: 0px;
    left: 50px;
    width: 100%;
    max-width: 320px;
}

.ornamental-line svg {
  width: 100%;
  height: 40px;
}

/* linha principal */
.line {
  stroke: #d4af37;
  stroke-width: 2;
}

/* detalhe central */
.ornament {
  fill: #d4af37;
}

/* pequenos detalhes */
.detail {
  stroke: #d4af37;
  stroke-width: 2;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="card-wrapper">
<div class="ornamental-line">
  <svg viewBox="0 0 600 40" preserveAspectRatio="none">
    
    <!-- linha esquerda -->
    <line x1="0" y1="20" x2="270" y2="20" class="line"/>

    <!-- linha direita -->
    <line x1="330" y1="20" x2="600" y2="20" class="line"/>

    <!-- detalhe central (diamante) -->
    <polygon points="300,14 306,20 300,26 294,20" class="ornament"/>

    <!-- pequenos traços laterais -->
    <line x1="270" y1="20" x2="285" y2="20" class="detail"/>
    <line x1="315" y1="20" x2="330" y2="20" class="detail"/>

  </svg>
</div>
  <!-- SVG ULTRA DETALHADO -->
  <svg class="card-frame" viewBox="0 0 420 520" preserveAspectRatio="none">

    <defs>
      <!-- gradiente dourado -->
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="50%" stop-color="#d4af37"/>
        <stop offset="100%" stop-color="#8c6b1f"/>
      </linearGradient>

      <!-- brilho -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- sombra interna -->
      <filter id="innerShadow">
        <feOffset dx="0" dy="0"/>
        <feGaussianBlur stdDeviation="4" result="offset-blur"/>
        <feComposite operator="out" in="SourceGraphic" in2="offset-blur"/>
        <feFlood flood-color="#000" flood-opacity="0.7"/>
        <feComposite operator="in"/>
        <feComposite in2="SourceGraphic" operator="over"/>
      </filter>
    </defs>

    <!-- BORDA PRINCIPAL -->
    <rect x="5" y="5" width="410" height="510" rx="20"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2"
    filter="url(#glow)"/>
    
    <!-- BORDA INTERNA -->
    <rect x="12" y="12" width="396" height="496" rx="16"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1"
    opacity="0.4"/>
    

  </svg>

  <!-- CONTEÚDO -->
  <div class="card-content">
    
    <h1>BEM-VINDO</h1>
    <p>Sua jornada começa agora</p>

          <div class="caixa-login">
        <div class="input-group">
          <i class="icon icon-user"></i>
          <input type="email" placeholder="Email" />
        </div>
        <div class="input-group">
          <i class="icon icon-lock"></i>
          <input type="password" placeholder="Senha" />
          <i class="icon icon-eye"></i>
        </div>
        </div>
  </div>

</div>

</body>
</html>
