<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha Padrão - Elara</title>
    <link rel="stylesheet" href="css/ficha-elara.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="theme-dark">
    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="themes">
            <button class="theme-btn active" data-theme="dark" type="button">Noturno</button>
            <button class="theme-btn" data-theme="light" type="button">Claro</button>
            <button class="theme-btn" data-theme="parchment" type="button">Pergaminho</button>
          </div>
        </div>

        <div class="topbar-center">
          <div class="points">
            <span>Pontos Restantes:</span>
            <strong id="points-remaining">0</strong>
          </div>
          <button id="save-btn" class="btn-save" type="button">Salvar Ficha</button>
        </div>

        <div class="topbar-right"></div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-page="main" type="button">Personagem</button>
        <button class="tab" data-page="abilities" type="button">Habilidades (Cards)</button>
      </nav>

      <section id="page-main" class="page active">
        <div class="paper">
          <div class="sheet-header">
            <div class="avatar-wrap">
              <div class="avatar" id="avatar-container" style="cursor: pointer;" title="Clique para alterar a foto">
                <img id="avatar-img" alt="" />
                <input id="avatar-file" type="file" accept="image/*" />
                <div class="avatar-overlay" id="avatar-overlay" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
                  <button id="avatar-btn-upload" class="btn-secondary" type="button" style="width: 80%;">Upload</button>
                  <button id="avatar-btn-link" class="btn-secondary" type="button" style="width: 80%;">Link URL</button>
                </div>
              </div>
            </div>

            <div class="header-fields">
              <div class="field field-name">
                <label>Nome do Personagem</label>
                <input id="nomePersonagem" type="text" value="" />
              </div>

              <div class="header-row">
                <div class="field">
                  <label>Nickname</label>
                  <input id="nickname" type="text" value="" />
                </div>
                <div class="field">
                  <label>Classe & Nível</label>
                  <input id="classLevel" type="text" value="" />
                </div>
                <div class="field">
                  <label>Antecedente</label>
                  <input id="background" type="text" value="" />
                </div>
              </div>
            </div>
          </div>

          <div class="grid">
            <aside class="col col-attrs">
              <div class="attr-card" data-attr="str">
                <div class="attr-title">Força</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-str" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-str">+0</div>
              </div>

              <div class="attr-card" data-attr="dex">
                <div class="attr-title">Destreza</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-dex" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-dex">+0</div>
              </div>

              <div class="attr-card" data-attr="con">
                <div class="attr-title">Constituição</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-con" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-con">+0</div>
              </div>

              <div class="attr-card" data-attr="int">
                <div class="attr-title">Inteligência</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-int" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-int">+0</div>
              </div>

              <div class="attr-card" data-attr="wis">
                <div class="attr-title">Sabedoria</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-wis" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-wis">+0</div>
              </div>

              <div class="attr-card" data-attr="cha">
                <div class="attr-title">Carisma</div>
                <div class="attr-main">
                  <button class="attr-btn" data-delta="-1" type="button">-</button>
                  <input id="attr-cha" type="number" value="0" />
                  <button class="attr-btn" data-delta="1" type="button">+</button>
                </div>
                <div class="attr-mod" id="mod-cha">+0</div>
              </div>

              <div id="custom-attributes-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
              
              <button id="btn-add-attribute" class="btn-secondary" type="button" style="width: 100%; border-style: dashed; opacity: 0.8;">
                + Adicionar Atributo
              </button>
            </aside>

            <section class="col col-main">
              <div class="vitals">
                <div class="vital">
                  <div class="vital-title">CA</div>
                  <input id="ac" type="number" value="0" />
                </div>
                <div class="vital">
                  <div class="vital-title">Iniciativa</div>
                  <input id="initiative" type="text" value="" />
                </div>
                <div class="vital">
                  <div class="vital-title">Desloc.</div>
                  <input id="speed" type="text" value="" />
                </div>
              </div>

              <div class="hp">
                <div class="hp-top">
                  <div class="hp-title">Pontos de Vida Atuais</div>
                  <div class="hp-max">
                    <label>Máximo:</label>
                    <input id="hpMax" type="number" value="0" />
                  </div>
                </div>
                <input id="hpCurrent" class="hp-current" type="number" value="0" />
              </div>

              <div class="box">
                <div class="box-title">Ataques & Magias</div>
                <textarea id="attacks"></textarea>
              </div>
            </section>

            <aside class="col col-side">
              <div class="box box-tall">
                <div class="box-title">Características & Talentos</div>
                <textarea id="traits"></textarea>
              </div>
              <div class="box">
                <div class="box-title">Idiomas & Outras Proficiências</div>
                <textarea id="proficiencies"></textarea>
              </div>
            </aside>
          </div>
        </div>
      </section>

      <section id="page-abilities" class="page">
        <div class="abilities-header">
          <div class="abilities-title">Meus Cards de Habilidades</div>
          <button id="add-ability" class="btn-secondary" type="button">Criar Novo Card</button>
        </div>

        <div id="abilities-grid" class="abilities-grid"></div>

        <div id="ability-modal" class="modal" style="display: none">
          <div class="modal-card">
            <div class="modal-title">Editor de Habilidade</div>
            <div class="modal-fields">
              <div class="field">
                <label>Título</label>
                <input id="ability-title" type="text" />
              </div>
              <div class="field">
                <label>URL da Imagem (opcional)</label>
                <input id="ability-image" type="text" />
              </div>
              <div class="field">
                <label>Descrição</label>
                <textarea id="ability-desc"></textarea>
              </div>
              <div class="field">
                <label>Cor</label>
                <select id="ability-color">
                  <option value="skill">Verde (Habilidade)</option>
                  <option value="spell">Azul (Magia)</option>
                  <option value="trap">Rosa (Especial)</option>
                  <option value="dark">Escuro (Lendária)</option>
                </select>
              </div>
            </div>
            <div class="modal-actions">
              <button id="ability-cancel" class="btn-secondary" type="button">Cancelar</button>
              <button id="ability-save" class="btn-save" type="button">Salvar Card</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="js/ficha-elara.js"></script>
  </body>
</html>
